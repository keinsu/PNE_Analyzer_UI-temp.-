name: Build Battery Analysis Studio v3.1.6
on:
  push:
    branches: [main]
    paths: [.github/workflows/battery-studio-v3.1.6.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: BatteryAnalysisStudio_v3.1.3_Extracted/Battery_Analysis_Studio_v3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt pyinstaller-hooks-contrib==2026.0 psutil==7.2.2
      - name: Verify Step rules, presets, and saved RPT data before packaging
        shell: cmd
        run: call build_onefile.bat
      - name: Publish verified Windows EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'BatteryAnalysisStudio_v3.1.6_OneFile.exe'
          Copy-Item 'dist_onefile/BatteryAnalysisStudio_v3_OneFile.exe' $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release create v3.1.6 $asset --repo keinsu/PNE_Analyzer_UI-temp.- --target $env:GITHUB_SHA --title "Battery Analysis Studio v3.1.6" --notes "Windows x64 single-file build. SHA-256: $hash"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


